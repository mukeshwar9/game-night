name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests, build, size budget, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # No VITE_FIREBASE_* needed: the bundle builds without them (the app
      # only reports "not configured" at runtime), and CI never deploys.
      - name: Build
        run: npm run build

      - name: Entry bundle size budget
        run: node scripts/check-bundle-size.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Cloud Functions: bundle the shared src/lib logic and run its tests.
      - name: Functions tests
        run: npm --prefix functions ci && npm --prefix functions test

  emulator-tests:
    name: Rules + end-to-end tests (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Realtime Database emulator is a Java app.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # test:rules / test:e2e call the `firebase` CLI directly.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Security rules tests
        run: npm run test:rules

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
