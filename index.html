<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Play games with friends online — no account needed" />
    <meta name="theme-color" content="#080810" />
    <!-- Social / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Game Night" />
    <meta property="og:title" content="Game Night — play with friends, no account needed" />
    <meta property="og:description" content="29+ quick multiplayer games. Share a link, play instantly." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Game Night — play with friends, no account needed" />
    <meta name="twitter:description" content="29+ quick multiplayer games. Share a link, play instantly." />
    <meta name="twitter:image" content="/pwa-512x512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>document.documentElement.dataset.theme = localStorage.getItem('retro-theme') || 'midnight'</script>
    <title>Game Night</title>
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Pre-JS splash: static subset of ArcadeLoader's boot attract cluster
           (src/components/ArcadeLoader.jsx). React's createRoot().render()
           replaces this on mount; in prod, vite build extracts index.css into
           a render-blocking <link> in <head>, so these classes resolve before
           this ever paints (dev mode is briefly unstyled). -->
      <div class="min-h-screen bg-retro-bg flex flex-col items-center justify-center">
        <p class="font-pixel text-base sm:text-lg tracking-[0.15em] text-retro-cta text-glow-cta arcade-blink">
          INSERT COIN
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
