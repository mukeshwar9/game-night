<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Play games with friends online — no account needed" />
    <meta name="theme-color" content="#8b6612" />
    <!-- Social / link previews. Absolute URLs: WhatsApp/iMessage/Slack crawlers
         don't resolve relative og:image paths. og-image.png is generated by
         scripts/make-og-image.mjs (re-run it when the game count or copy changes). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Game Night" />
    <meta property="og:url" content="https://game-night-91464.web.app/" />
    <meta property="og:title" content="Game Night — play with friends, no account needed" />
    <meta property="og:description" content="60+ quick games for 2–8 friends. Share a link, play instantly." />
    <meta property="og:image" content="https://game-night-91464.web.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Game Night — 60+ quick games for 2–8 friends" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Game Night — play with friends, no account needed" />
    <meta name="twitter:description" content="60+ quick games for 2–8 friends. Share a link, play instantly." />
    <meta name="twitter:image" content="https://game-night-91464.web.app/og-image.png" />
    <meta name="twitter:image:alt" content="Game Night — 60+ quick games for 2–8 friends" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('retro-theme') || 'matcha'
      document.documentElement.dataset.font = localStorage.getItem('retro-font') || 'press-start'
    </script>
    <title>Game Night</title>
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Pre-JS splash: mirrors the ConnectingSplash markup in
           src/lib/AuthContext.jsx. React's createRoot().render()
           replaces this on mount; in prod, vite build extracts index.css into
           a render-blocking <link> in <head>, so these classes resolve before
           this ever paints (dev mode is briefly unstyled). -->
      <div class="min-h-screen bg-retro-bg flex flex-col items-center justify-center">
        <p class="font-pixel text-base sm:text-lg tracking-[0.15em] text-retro-cta text-glow-cta arcade-blink">
          INSERT COIN
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
